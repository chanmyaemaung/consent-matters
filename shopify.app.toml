# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bf8394145f6e6967e5cef51ba50aaeb6"
name = "Consent Matters"
application_url = "https://consent-matters.myanmarnode.com/app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = ""

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://consent-matters.myanmarnode.com/auth/callback" ]

[app_proxy]
url = "https://consent-matters.myanmarnode.com"
prefix = "apps"
subpath = "consent-matters"

[build]
# Keep production URLs stable — never let `shopify app dev` overwrite
# them with a tunnel host. Dev sessions still work via their own draft.
automatically_update_urls_on_dev = false
